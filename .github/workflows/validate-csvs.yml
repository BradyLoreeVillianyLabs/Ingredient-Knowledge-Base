name: Validate ingredient CSVs

on:
  pull_request:
  push:
    branches:
      - main
      - feature/ingredient-list-package

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run full build pipeline
        run: python scripts/build_all.py

      - name: Run smoke tests
        run: python tests/smoke_test_pipeline.py

      - name: Check generated artifacts
        run: |
          test -s dist/ingredient_knowledge_base.sqlite
          test -s dist/ingredient-knowledge-base-csv.zip
          test -s dist/ingredient-knowledge-base-json.zip
          test -s data/generated/json/ingredients.json
          test -s data/generated/evidence_packs_index.json
          test -s data/generated/rich_ingredient_profiles.csv
          test -s docs/DATASET_REPORT.md
          test -s docs/MISSING_DATA_REPORT.md

      - name: Check rich profile row count
        run: python scripts/check_rich_profile_count.py
